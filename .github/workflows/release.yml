name: Build and Release Professional Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          # Pin to the toolchain the Lab Console migration was verified on.
          # `channel: stable` alone is a moving target — a newer stable can
          # break compilation of dropped-in design-system code that passed
          # locally. Bump deliberately, not implicitly.
          flutter-version: "3.41.8"

      - name: Install dependencies
        run: flutter pub get

      # Run the full test suite only on Linux: golden baselines are rendered
      # on Ubuntu (see CLAUDE.md), so test/golden/* mismatches on macOS/Windows
      # runners due to cross-OS font antialiasing — running them there would
      # fail the release for non-regressions. Visual regression is already
      # gated per-PR by ui_check.yml on Ubuntu.
      - name: Run Tests
        if: matrix.os == 'ubuntu-latest'
        run: flutter test

      - name: Run Windows large JSON & update regressions
        if: matrix.os == 'windows-latest'
        run: >-
          flutter test --no-pub
          test/services/json_formatter_service_test.dart
          test/widgets/json_virtualized_editor_test.dart
          test/widgets/json_tree_view_performance_test.dart
          test/utils/version_helper_test.dart
          test/services/app_update_service_test.dart

      - name: Set Build Date and Version
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          # Get current version (e.g., 1.0.0+1)
          CURRENT_VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          # Extract base version (remove everything after +)
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d+ -f1)

          # Construct new version: 1.0.0-20251222
          NEW_VERSION="${BASE_VERSION}-${BUILD_DATE}"

          echo "Updating version from $CURRENT_VERSION to $NEW_VERSION"
          sed -i.bak "s/version: $CURRENT_VERSION/version: $NEW_VERSION/" pubspec.yaml

          # Also update version in installer.iss for Windows
          if [ -f "windows/installer.iss" ]; then
            sed -i.bak "s/#define MyAppVersion .*/#define MyAppVersion \"$NEW_VERSION\"/" windows/installer.iss
          fi
        shell: bash

      - name: Setup flutter_distributor
        run: dart pub global activate flutter_distributor

      # --- Linux Setup ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: |
          choco install innosetup
        shell: pwsh

      # --- Linux Build ---
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --release

      - name: Smoke Test Linux Worker IPC
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a dart tool/worker_ipc_smoke.dart build/linux/x64/release/bundle/iot_devkit

      - name: Package Linux (Tarball)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../dist/iot_devkit_linux.tar.gz *

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release
        shell: pwsh

      - name: Smoke Test Windows Worker IPC
        if: matrix.os == 'windows-latest'
        run: dart tool/worker_ipc_smoke.dart build\windows\x64\runner\Release\iot_devkit.exe
        shell: pwsh

      - name: Package Windows (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: iscc windows/installer.iss
        shell: pwsh

      - name: Build and Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npm install -g appdmg
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          # Build universal binary to support both ARM and Intel
          flutter_distributor release --name release --jobs macos-dmg
        shell: bash

      - name: Smoke Test macOS Worker IPC
        if: matrix.os == 'macos-latest'
        run: dart tool/worker_ipc_smoke.dart build/macos/Build/Products/Release/iot_devkit.app/Contents/MacOS/iot_devkit
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: dist/

  publish:
    name: Publish Release & Update Manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-packages"
          path: artifacts-in

      - name: Collect Release Packages
        run: |
          mkdir -p dist
          find artifacts-in -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp -v {} dist/ \;
          ls -lh dist/

      - name: Generate Release Notes & Update Manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REQUIRE_ALL_PLATFORMS: "true"
        run: |
          bash scripts/generate_release_notes.sh dist/release-notes.md
          bash scripts/generate_update_manifest.sh dist dist/release-notes.md dist/latest.json dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IoT DevKit ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/latest.json
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
